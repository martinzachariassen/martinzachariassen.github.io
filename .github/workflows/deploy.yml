name: Deploy to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main          # always build from main, regardless of tag ref
          fetch-depth: 0     # needed for git describe --tags

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        run: |
          # For a release event the tag name is in github.event.release.tag_name
          # For manual dispatch fall back to latest tag or short SHA
          TAG="${{ github.event.release.tag_name }}"
          if [[ -n "$TAG" ]]; then
            VERSION="$TAG"
          else
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || git rev-parse --short HEAD)
          fi
          echo "VITE_APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Refresh Umami script
        run: curl -s https://cloud.umami.is/script.js -o public/umami.js

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
